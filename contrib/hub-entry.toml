# Entry for the ricercar plugin hub (github.com/ricercar-player/ricercar-plugins),
# to publish as plugins/plex.toml. On a release, update `version`, the
# URLs and the SHA-256 from the release's .sha256 files.
id = "plex"
name = "Plex"
description = "Browse, search and play the music of your own Plex Media Server. Albums, artists and playlists merged into your library, recent albums on Home, favourites shared with Plex; plays show on the server. Original files, bit for bit; FLAC at a rate your DAC takes when it cannot play the file's."
author = "ricercar-player"
license = "MIT"
repository = "https://github.com/ricercar-player/ricercar-plex"
version = "0.2.0"
protocol = 1
capabilities = ["auth", "browse", "search", "resolve", "favorites", "reporting", "library"]

